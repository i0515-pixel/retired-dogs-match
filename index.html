  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function renderQuestion() {
    const q = QUESTIONS[currentStep];
    const total = QUESTIONS.length;
    
    document.getElementById('step-label').innerText = `${currentStep + 1}/${total}`;
    const percent = Math.round(((currentStep + 1) / total) * 100);

    document.getElementById('progress-bar').style.width = `${percent}%`;
    
    document.getElementById('question-text').innerText = q.title;
    
    const optContainer = document.getElementById('option-list');
    optContainer.innerHTML = '';

      prevBtn.style.visibility = 'hidden';

      prevBtn.style.visibility = 'visible';

  function selectOption(val) {
    userAnswers[currentStep] = val;

      currentStep++;

  // 소개글 기반 성향 분석 함수
  function analyzeDogProfile(dog) {
    const base = BASE_SCORES[dog.품종] || [3, 3, 3];
    let activity = base[0];
    const beginnerFriendly = base[1];
    const animalFriendly = base[2];

    const tags = [];
    let notice = "";

    const intro = dog.소개 || "";

    // 활동량 수정 및 태그
    if (intro.includes("활발") || intro.includes("에너지") || intro.includes("뛰어")) {
      activity += 1;
      tags.push("🏃 에너지 뿜뿜");
    } else if (intro.includes("차분") || intro.includes("조용") || intro.includes("온순") || intro.includes("순한")) {
      activity -= 1;
      tags.push("🛋️ 차분한 편");
    }

    // 범위 제한 (1~5)
    activity = Math.max(1, Math.min(5, activity));

    // 애교쟁이 태그
    if (intro.includes("애교") || intro.includes("안기") || intro.includes("배를")) {
      tags.push("💕 애교쟁이");
    }

    // 주의 문구
    if (intro.includes("겁") || intro.includes("낯") || intro.includes("소심")) {
      notice = "💡 새 환경에 천천히 적응해요";
    }

    return { activity, beginnerFriendly, animalFriendly, tags, notice };
  }

  // 궁합 계산 로직
  function calculateAndShowResult() {
    const [ansWalk, ansHome, ansPet, ansExp, ansTrait] = userAnswers;

    const scoredDogs = DOGS.map(dog => {
      const profile = analyzeDogProfile(dog);
      let score = 100;
      const reasons = [];

      // 1. 산책 차이 감점
      const walkDiff = Math.abs(ansWalk - profile.activity);
      score -= walkDiff * 10;
      if (walkDiff === 0) {
        reasons.push("보호자님의 일상 산책 시간과 활동 수준이 아주 잘 맞아요.");
      }

      // 2. 주거 환경
      if (ansHome === "아파트·빌라" && profile.activity === 5) {
        score -= 10;
      } else if (ansHome === "마당 있는 주택" && profile.activity >= 4) {
        score += 5;
        reasons.push("마당이 있는 넓은 환경에서 활기차게 뛰어놀기 좋아요.");
      }

      // 3. 다른 반려동물 유무
      if (ansPet === "있어") {
        score -= (5 - profile.animalFriendly) * 6;
        if (profile.animalFriendly >= 4) {
          reasons.push("다른 동물 친구들과도 원만하게 교감하는 편이에요.");
        }
      }

      // 4. 반려 경험
      const reqExp = 6 - profile.beginnerFriendly;
      if (ansExp < reqExp) {
        score -= (reqExp - ansExp) * 8;
      } else if (ansExp >= reqExp && reasons.length < 2) {
        reasons.push("보호자님의 반려 경험으로 든든하게 이끌어줄 수 있어요.");
      }

      // 5. 원하는 성격
      let traitMatched = false;
      if (ansTrait === "애교쟁이" && profile.tags.includes("💕 애교쟁이")) {
        score += 10;
        traitMatched = true;
        reasons.push("원하시던 대로 사람 품과 스킨십을 정말 좋아하는 사랑둥이에요.");
      } else if (ansTrait === "차분한 친구" && profile.tags.includes("🛋️ 차분한 편")) {
        score += 10;
        traitMatched = true;
        reasons.push("보호자님이 바라시던 의젓하고 차분한 매력을 지녔어요.");
      } else if (ansTrait === "놀이 친구" && profile.activity >= 4) {
        score += 10;
        traitMatched = true;
        reasons.push("지치지 않는 쾌활함으로 최고의 놀이 메이트가 되어줄 거예요.");
      }

      // 기본 이유 보충 (최소 1개 이상)
      if (reasons.length === 0) {
        reasons.push("보호자님의 생활 패턴과 차근차근 서로 맞춰가기 좋은 친구예요.");
      }

      // 최종 점수 40~99점 제한
      score = Math.max(40, Math.min(99, score));

      return {
        ...dog,
        profile,
        score,
        matchedReasons: reasons.slice(0, 2)
      };
    });

    // 점수 높은 순 정렬
    scoredDogs.sort((a, b) => b.score - a.score);

    // 상위 3마리 렌더링
    const top3 = scoredDogs.slice(0, 3);
    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    top3.forEach((dog, idx) => {
      const emoji = BREED_EMOJI[dog.품종] || "🐶";
      const introDisplay = dog.소개 && dog.소개.trim() !== "" ? dog.소개 : "아직 소개글이 없어요 ✍️";

      const card = document.createElement('div');
      card.className = `dog-card ${idx === 0 ? 'rank-1' : ''}`;

      let tagsHtml = dog.profile.tags.map(t => `<span class="tag primary">${t}</span>`).join('');
      tagsHtml += `<span class="tag">#${dog.품종}</span>`;
      tagsHtml += `<span class="tag">#${dog.업무}</span>`;

      let noticeHtml = dog.profile.notice ? `<div class="notice-box">${dog.profile.notice}</div>` : '';

      let reasonsHtml = dog.matchedReasons.map(r => `<div>✔ ${r}</div>`).join('');

      card.innerHTML = `
        <div class="card-top">
          <div class="dog-emoji">${emoji}</div>
          <div class="dog-meta">
            <div class="score-badge">${dog.score}<span>% 매칭</span></div>
            <div class="dog-name">${dog.이름} <span style="font-size:14px; color:#888; font-weight:normal;">(${dog.성별})</span></div>
            <div class="dog-sub">${dog.업무} 출신 · ${dog.품종}</div>
          </div>
        </div>

        <div class="tag-group">${tagsHtml}</div>
        ${noticeHtml}

        <div class="match-reasons">
          <div class="reasons-title">✨ 이래서 잘 맞아요</div>
          <div class="reason-text">${reasonsHtml}</div>
        </div>

        <div class="dog-intro">
          <strong>소개:</strong> ${introDisplay}
        </div>
      `;

      container.appendChild(card);
    });

    showScreen('screen-result');
  }

  function restartQuiz() {
    showScreen('screen-start');
  }
</script>

</body>
</html>
