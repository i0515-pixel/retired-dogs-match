<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나랑 딱 맞는 은퇴견 짝꿍 찾기</title>
  <style>
    /* 기본 리셋 및 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 50%, #f0fdf4 100%);
      color: #374151;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* 반응형 메인 컨테이너 */
    .app-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(217, 119, 6, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #fef08a;
    }

    /* 화면 전환 제어 */
    .screen {
      display: none;
      padding: 28px 22px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 상단 배지 & 타이틀 */
    .badge {
      display: inline-block;
      align-self: center;
      padding: 6px 14px;
      background: #fef3c7;
      color: #b45309;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      color: #1f2937;
      text-align: center;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .subtitle {
      font-size: 15px;
      color: #6b7280;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .hero-icon {
      font-size: 72px;
      text-align: center;
      margin: 10px 0 20px;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .info-box {
      background: #fefce8;
      border: 1.5px dashed #fde047;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      margin-bottom: 28px;
    }

    .info-box span {
      font-size: 18px;
      font-weight: 800;
      color: #b45309;
    }

    /* 버튼 스타일 */
    .btn {
      width: 100%;
      padding: 16px 20px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      user-select: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(245, 158, 11, 0.35);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: linear-gradient(135deg, #d97706, #b45309);
    }

    .btn-option {
      background: #f9fafb;
      color: #374151;
      border: 2px solid #e5e7eb;
      margin-bottom: 12px;
      text-align: left;
      justify-content: flex-start;
      font-weight: 600;
      font-size: 15px;
      padding: 16px 18px;
    }

    .btn-option:hover {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .btn-option:active {
      transform: scale(0.985);
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .btn-secondary {
      background: transparent;
      color: #9ca3af;
      box-shadow: none;
      padding: 10px;
      font-size: 14px;
      margin-top: 6px;
      font-weight: 600;
    }

    .btn-secondary:hover {
      color: #4b5563;
    }

    /* 질문 프로그레스 바 */
    .progress-wrap {
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #d97706;
    }

    .progress-bar-bg {
      height: 8px;
      background: #f3f4f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 20px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 20px;
      line-height: 1.4;
      text-align: center;
      word-break: keep-all;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    /* 결과 화면 카드 스타일 */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dog-card {
      background: #ffffff;
      border: 1.5px solid #fed7aa;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(249, 115, 22, 0.08);
      position: relative;
      overflow: hidden;
    }

    .rank-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ffedd5;
      color: #ea580c;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .dog-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .dog-avatar {
      font-size: 42px;
      background: #fff7ed;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      border: 1px solid #ffedd5;
      flex-shrink: 0;
    }

    .dog-meta {
      flex: 1;
    }

    .dog-name-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .dog-name {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .dog-sub {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
    }

      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 800;
      color: #d97706;
      background: #fef3c7;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .tags-row {

      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;

    .tag-blue { background: #e0f2fe; color: #0369a1; }

      padding: 12px 14px;
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;

    .reasons-box strong {
      display: block;
      color: #0f172a;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .reasons-box ul {
      padding-left: 16px;

      line-height: 1.55;

      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
      margin-top: 14px;
      margin-bottom: 16px;
      word-break: keep-all;

      </p>
    </div>

          { text: "있어 (함께 지낼 가족이 있어요)", value: "있어" },
          { text: "없어 (오직 한 마리만 키워요)", value: "없어" }
        ]
      },
      {
        question: "강아지를 키워 본 경험은 어때?",
        options: [
          { text: "처음이야 (초보 보호자)", value: 1 },
          { text: "키워 봤어 (경험자)", value: 3 },
          { text: "훈련도 자신 있어 (숙련자)", value: 5 }
        ]
      },
      {
        question: "어떤 성격의 친구를 원해?",
        options: [
          { text: "애교쟁이 (품에 쏙 안기는 성격)", value: "애교쟁이" },
          { text: "차분한 친구 (조용하고 의젓한 성격)", value: "차분한 친구" },
          { text: "놀이 친구 (공놀이와 터그놀이 매니아)", value: "놀이 친구" }
        ]
      }
    ];

    // 상태 관리
    let currentStep = 0;
    const userAnswers = [];

    // DOM 요소
    const screenStart = document.getElementById("screen-start");
    const screenQuiz = document.getElementById("screen-quiz");
    const screenResult = document.getElementById("screen-result");

    const btnStart = document.getElementById("btn-start");
    const btnPrev = document.getElementById("btn-prev");
    const btnRestart = document.getElementById("btn-restart");

    const waitingCountEl = document.getElementById("waiting-count");
    const quizQuestionEl = document.getElementById("quiz-question");
    const quizOptionsEl = document.getElementById("quiz-options");
    const progressTextEl = document.getElementById("progress-text");
    const progressFillEl = document.getElementById("progress-fill");
    const topDogsListEl = document.getElementById("top-dogs-list");

    // 초기화
    function init() {
      waitingCountEl.textContent = `${DOGS.length}마리`;
      btnStart.addEventListener("click", startQuiz);
      btnPrev.addEventListener("click", prevQuestion);
      btnRestart.addEventListener("click", restartQuiz);
    }

    // 화면 전환 헬퍼
    function switchScreen(targetScreen) {
      [screenStart, screenQuiz, screenResult].forEach(s => s.classList.remove("active"));
      targetScreen.classList.add("active");
    }

    // 퀴즈 시작
    function startQuiz() {
      currentStep = 0;
      userAnswers.length = 0;
      renderQuestion();
      switchScreen(screenQuiz);
    }

    // 질문 렌더링
    function renderQuestion() {
      const q = QUESTIONS[currentStep];
      quizQuestionEl.textContent = `${currentStep + 1}. ${q.question}`;
      progressTextEl.textContent = `${currentStep + 1} / ${QUESTIONS.length}`;
      progressFillEl.style.width = `${((currentStep + 1) / QUESTIONS.length) * 100}%`;

      // 이전 버튼 노출 여부
      btnPrev.style.visibility = currentStep === 0 ? "hidden" : "visible";

      // 보기 생성
      quizOptionsEl.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-option";
        btn.textContent = opt.text;
        btn.addEventListener("click", () => handleSelectAnswer(opt.value));
        quizOptionsEl.appendChild(btn);
      });
    }

    // 보기 선택 처리
    function handleSelectAnswer(val) {
      userAnswers[currentStep] = val;
      if (currentStep < QUESTIONS.length - 1) {
        currentStep++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    // 이전 질문
    function prevQuestion() {
      if (currentStep > 0) {
        currentStep--;
        renderQuestion();
      }
    }

    // 강아지 성향 및 태그 계산 함수
    function parseDogTraits(dog) {
      const base = BREED_BASE[dog.품종] || BREED_BASE["기타"];
      let activity = base[0];
      const beginner = base[1];
      const animal = base[2];

      const tags = [];
      let caution = "";

      const intro = dog.소개 || "";

      // 1. 활동량 및 태그 판정
      const hasEnergetic = ["활발", "에너지", "뛰어"].some(k => intro.includes(k));
      const hasCalm = ["차분", "조용", "온순", "순한"].some(k => intro.includes(k));

      if (hasEnergetic) {
        activity += 1;
        tags.push("🏃 에너지 뿜뿜");
      }
      if (hasCalm) {
        activity -= 1;
        tags.push("🛋️ 차분한 편");
      }

      // 활동량 1~5 클램핑
      if (activity < 1) activity = 1;
      if (activity > 5) activity = 5;

      // 2. 애교 태그 판정
      if (["애교", "안기", "배를"].some(k => intro.includes(k))) {
        tags.push("💕 애교쟁이");
      }

      // 3. 주의 문구 판정
      if (["겁", "낯", "소심"].some(k => intro.includes(k))) {
        caution = "💡 새 환경에 천천히 적응해요";
      }

      return {
        activity,
        beginner,
        animal,
        tags,
        caution
      };
    }

    // 궁합 점수 및 추천 사유 산출
    function calculateMatch(dog, answers) {
      const [walkAns, houseAns, otherPetAns, expAns, traitAns] = answers;
      const traits = parseDogTraits(dog);

      let score = 100;
      const reasons = [];

      // 1. 산책 점수 (|답변 - 활동량| * 10 감점)
      const walkDiff = Math.abs(walkAns - traits.activity);
      score -= walkDiff * 10;
      if (walkDiff === 0) {
        reasons.push("보호자님의 산책 시간과 강아지의 활동량이 완벽히 일치해요!");
      } else if (walkDiff === 1) {
        reasons.push("하루 산책 주기가 서로에게 부담 없이 편안해요.");
      }

      // 2. 주거 환경 점수
      if (houseAns === "아파트·빌라" && traits.activity === 5) {
        score -= 10;
      } else if (houseAns === "마당 있는 주택" && traits.activity >= 4) {
        score += 5;
        reasons.push("마당이 있어 에너지를 마음껏 발산하기 좋아요!");
      } else if (houseAns === "아파트·빌라" && traits.activity <= 3) {
        reasons.push("실내 공간에서도 차분하고 안정적으로 생활할 수 있어요.");
      }

      // 3. 다른 반려동물 여부
      if (otherPetAns === "있어") {
        const petPenalty = (5 - traits.animal) * 6;
        score -= petPenalty;
        if (traits.animal >= 4) {
          reasons.push("동물 친구에 대한 친화력이 높아 다른 반려동물과 잘 지내요.");
        }
      } else {
        reasons.push("보호자님의 온전한 사랑을 독차지하며 편안하게 교감할 수 있어요.");
      }

      // 4. 반려 경험 점수
      const requiredExp = 6 - traits.beginner;
      if (expAns < requiredExp) {
        score -= (requiredExp - expAns) * 8;
      } else {
        if (traits.beginner >= 4) {
          reasons.push("온순하고 사람을 잘 따라 교감하기가 매우 수월해요.");
        } else if (expAns >= 3) {
          reasons.push("보호자님의 숙련된 반려 경험으로 든든하게 이끌어줄 수 있어요.");
        }
      }

      // 5. 원하는 성격 일치 여부
      let personalityMatched = false;
      if (traitAns === "애교쟁이" && traits.tags.includes("💕 애교쟁이")) {
        score += 10;
        reasons.push("원하시던 '특급 애교'를 아낌없이 보여주는 친구예요!");
        personalityMatched = true;
      }
      if (traitAns === "차분한 친구" && traits.tags.includes("🛋️ 차분한 편")) {
        score += 10;
        reasons.push("원하시던 '차분하고 의젓한' 매력을 듬뿍 지녔어요!");
        personalityMatched = true;
      }
      if (traitAns === "놀이 친구" && traits.activity >= 4) {
        score += 10;
        reasons.push("공놀이, 터그놀이를 함께 신나게 즐길 최고의 놀이 친구예요!");
        personalityMatched = true;
      }

      // 사유가 부족할 경우 품종 기본 강점 보충
      if (reasons.length === 0) {
        reasons.push(`${dog.품종} 특유의 듬직하고 영리한 매력으로 훌륭한 짝꿍이 되어줄 거예요.`);
      }

      // 점수 범위 조정: 40 ~ 99점
      if (score < 40) score = 40;
      if (score > 99) score = 99;

      return {
        dog,
        score,
        traits,
        reasons: reasons.slice(0, 2) // 상위 1~2개 표시
      };
    }

    // 결과 화면 표시
    function showResults() {
      // 모든 강아지의 점수 계산 후 높은 점수 순으로 정렬
      const evaluated = DOGS.map(dog => calculateMatch(dog, userAnswers));
      
      // 내림차순 정렬 (점수가 같으면 안정적인 순서 유지)
      evaluated.sort((a, b) => b.score - a.score);

      const top3 = evaluated.slice(0, 3);

      topDogsListEl.innerHTML = "";

      const rankNames = ["🥇 1순위 추천", "🥈 2순위 추천", "🥉 3순위 추천"];

      top3.forEach((item, idx) => {
        const { dog, score, traits, reasons } = item;
        const emoji = BREED_EMOJI[dog.품종] || "🐶";

        // 태그 렌더링
        let tagsHtml = "";
        traits.tags.forEach(t => {
          let colorClass = "tag-amber";
          if (t.includes("에너지")) colorClass = "tag-blue";
          if (t.includes("애교")) colorClass = "tag-pink";
          tagsHtml += `<span class="tag ${colorClass}">${t}</span>`;
        });

        // 주의 문구 렌더링
        let cautionHtml = "";
        if (traits.caution) {
          cautionHtml = `<span class="tag tag-warn">${traits.caution}</span>`;
        }

        // 소개글 렌더링
        const introText = dog.소개 && dog.소개.trim().length > 0 
          ? dog.소개 
          : "아직 소개글이 없어요 ✍️";

        // 이유 리스트
        const reasonsListHtml = reasons.map(r => `<li>${r}</li>`).join("");

        const card = document.createElement("div");
        card.className = "dog-card";
        card.innerHTML = `
          <div class="rank-badge">${rankNames[idx]}</div>
          <div class="dog-header">
            <div class="dog-avatar">${emoji}</div>
            <div class="dog-meta">
              <div class="dog-name-row">
                <span class="dog-name">${dog.이름}</span>
                <span class="dog-sub">(${dog.품종} · ${dog.성별} · ${dog.업무})</span>
              </div>
              <div class="match-score-pill">
                💖 궁합 점수: <strong>${score}%</strong>
              </div>
            </div>
          </div>

          ${(tagsHtml || cautionHtml) ? `<div class="tags-row">${tagsHtml}${cautionHtml}</div>` : ""}

          <div class="reasons-box">
            <strong>✨ 이래서 잘 맞아요!</strong>
            <ul>${reasonsListHtml}</ul>
          </div>

          <div class="dog-desc">
            ${introText}
          </div>
        `;

        topDogsListEl.appendChild(card);
      });

      switchScreen(screenResult);
      // 화면 최상단으로 부드럽게 스크롤
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 다시 하기
    function restartQuiz() {
      switchScreen(screenStart);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 앱 실행
    window.onload = init;
  </script>
</body>
</html>
